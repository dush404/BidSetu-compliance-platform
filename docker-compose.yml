services:
  strapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atc-strapi
    ports:
      - "1337:1337"
    environment:
      - HOST=0.0.0.0
      - PORT=1337
      - APP_KEYS=key1,key2,key3,key4
      - API_TOKEN_SALT=salt
      - ADMIN_JWT_SECRET=adminsecret
      - TRANSFER_TOKEN_SALT=transfersalt
      - JWT_SECRET=jwtsecret
      - DATABASE_CLIENT=sqlite
      - DATABASE_FILENAME=.tmp/data.db
    volumes:
      - ./backend/.tmp:/opt/app/.tmp
    restart: unless-stopped

  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: atc-ai-worker
    ports:
      - "8000:8000"
    env_file:
      - ./ai-worker/.env
    environment:
      - STRAPI_URL=http://strapi:1337
      - STRAPI_API_TOKEN=${STRAPI_API_TOKEN:-0dc570202be092f7b0a30ce9f154aed05e1dfe231d26c98e90491bb81f83ca7f894a809abac5dd5519af189d576fad82f44d0f218c6e0b475954d97248ef00b4f82b4c0a28dfd1e0e8eebc8d0eaba47c492b15757dcabb19d8f3b269ea649c348e1546e21f509a170a3165cdb045c147b9ef89b05478d3a789500ed43d233ee3}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - strapi
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atc-frontend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./db/custom.db
      - STRAPI_URL=http://strapi:1337
      - STRAPI_API_TOKEN=${STRAPI_API_TOKEN:-0dc570202be092f7b0a30ce9f154aed05e1dfe231d26c98e90491bb81f83ca7f894a809abac5dd5519af189d576fad82f44d0f218c6e0b475954d97248ef00b4f82b4c0a28dfd1e0e8eebc8d0eaba47c492b15757dcabb19d8f3b269ea649c348e1546e21f509a170a3165cdb045c147b9ef89b05478d3a789500ed43d233ee3}
      - AI_WORKER_URL=http://ai-worker:8000
    depends_on:
      - strapi
      - ai-worker
    restart: unless-stopped
